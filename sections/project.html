<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/styles.css">
    <script src="../scripts/proj.js" defer></script>
    <title>Formula Predict</title>
</head>
<body>
    <ul id="nav">
        <li><h1 class="head">Formula Predict</h1></li>
        <li><img src="../images/checkeredFlag.png" height="40px" width="40px"></li>
        <li><a href="../index.html">Standings</a></li>
        <li><a href="predict.html">Predict</a></li>
        <li><a href="project.html">Projection</a></li>
    </ul>
    <div class="head">
        <h1 id="head">Projection</h1>
    </div>
    <div class="wrapper">
        <section class="input">
            <h2>Input</h2>
            <p>Enter the results for the next race and see how the standings change!</p>
            <div id="errorYear" style="color: red;"></div>
            <input type="number" id="year" placeholder="Enter the year">
            <button id="smt" onclick="saveInput()">Submit</button><br>
            <table id="itable">
                <thead>
                    <tr>
                        <th>Position</th>
                        <th>Driver</th>
                    </tr>
                </thead>
                    <tbody id="inputRows"></tbody>
            </table>
        </section>
        <section class="stnds">
            <h2>Standings</h2>
            <table id="tab">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Points</th>
                        <th>Wins</th>
                        <th>Poles</th>
                    </tr>
                </thead>
                <tbody id="tbod"></tbody>
            </table>
        </section>
    </div>
</body>
</html>
