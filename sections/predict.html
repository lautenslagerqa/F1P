<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/styles.css">
    <script src="../scripts/pred.js" defer></script>
    <title>Formula Predict</title>
</head>
<body>
    <ul id="nav">
        <li><h1 class="head">Formula Predict</h1></li>
        <li><a href="../index.html">Standings</a></li>
        <li><a href="predict.html">Predict</a></li>
        <li><a href="project.html">Projection</a></li>
    </ul>
    <div class="head">
        <h1 id="head">Prediction</h1>
    </div>
    <div class="wrapper">
        <div class="stnds">
            <h2>Standings</h2>
            <h3 id="rr">Actual Remaining Races: </h3>
            <p>Input the amount of remaining races you wish to have:</p>
            <!-- <input type="number" id="y" placeholder="Enter the year"> -->
            <input type="number" id="r" placeholder="Enter race count">
            <button onclick="saveInput()">Submit</button><br>
            <table id="tab">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Points</th>
                        <th>Wins</th>
                        <th>Poles</th>
                    </tr>
                </thead>
                <tbody id="tbod"></tbody>
            </table>
        </div>
        <div class="elim">
            <h2>Eliminated Drivers</h2>
            <table id="el">
                <thead>
                    <tr><th>Drivers</th></tr>
                </thead>
                <tbody id="tb"></tbody>

            </table>
        </div>
    </div>
</body>
</html>
