<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/styles.css?v=2">
    <script src="script.js" defer></script>   
    <title>Formula Predict</title>
</head>
<body>
    <ul id="nav">
        <li><a href="./index.html">Standings</a></li>
        <li><a href="./sections/predict.html">Predict</a></li>
        <li><a href="./sections/project.html">Projection</a></li>
    </ul>
    <div class="head">
        <h1 id="head">Formula Predict</h1>
    </div>
    <div class="wrapper">
        <div class="stnds">
            <h2>Standings</h2>
            <input type="number" id="year" placeholder="Enter the year">
            <button onclick="saveInput()">Submit</button><br>
            
            <table id="tab">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Points</th>
                        <th>Wins</th>
                        <th>Poles</th>
                    </tr>
                </thead>
                <tbody id="tbod"></tbody>
            </table>
        </div>
        <div class="h2h">
            <h2>Head-to-Head</h2>
            <label for="driv1">Driver 1:</label>
            <select name="driv1" id="driv1"></select>
            <label for="driv2">Driver 2:</label>
            <select name="driv2" id="driv2"></select>
            <button onclick="compInput()">Submit</button><br>
            <table id="comp">
                <tbody>
                    <tr>
                        <th>Points</th>
                    </tr>
                    <tr>
                        <th>Wins</th>
                    </tr>
                    <tr>
                        <th>Poles</th>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
